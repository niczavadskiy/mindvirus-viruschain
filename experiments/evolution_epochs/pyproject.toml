[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steerchain"
version = "0.1.0"
description = "Hidden-state steering of idea propagation on a mind-virus hop chain."
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml", "matplotlib"]

[project.optional-dependencies]
# Matches requirements-hf.txt (known-good mini smoke). No torchaudio/torchvision/ST.
hf = [
    "numpy>=1.24,<2",
    "torch>=2.5.0",
    "transformers>=4.54.0",
    "accelerate>=0.33.0",
    "huggingface_hub>=1.5,<2",
    "requests>=2.31",
]

[project.scripts]
steerchain = "steerchain.__main__:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
