# Reduced-batch HF smoke on the paper host (Qwen3.5-2B-Base).
# Needs torch>=2.5 + transformers with model_type qwen3_5.
# Prefer tool-hardened twin: configs/smoke_hf_mini_instruct.yaml
# Fallback without qwen3_5: configs/smoke_hf_mini_qwen25.yaml

model_id: Qwen/Qwen3.5-2B-Base
judge_model_id: null
embedding_model_id: BAAI/bge-small-en-v1.5
backend: hf
embedder: transformers

n_hops: 10
agents_per_hop: 2
turns_per_hop: 2
max_tool_loops: 3
require_tool_action: true
tool_retries: 1
native_tools: true
n_epochs: 2
seeds: [0]
n_seed_agents: 1

ideologies:
  - whale_welfare
conditions: [A, B]

norm_mode: unit
beta: 1.0
fixed_norm: 1.0
tau: null
pair_spreader_hop: 9
pair_target_hop: 10
probe_retention_threshold: 1.0
transformer_layer_k: null
layer_select_mode: max_delta
hidden_size: 2048
max_new_tokens: 128
run_probes: true
run_dir: runs/smoke_hf_mini
hf_token: null

sae:
  enabled: false
  repo_id: Qwen/SAE-Res-Qwen3.5-2B-Base-W32K-L0_100
  architecture: topk
  top_k: 100
  d_sae: 32768
  d_model: 2048
  activation_site: resid_post_layer
  transformer_layer_k: 12
  decoder_topk: 50
  consensus_threshold: 0.5
  cluster_method: agglomerative
  run_mode_a: true
  run_mode_b: true
  run_causal: false
